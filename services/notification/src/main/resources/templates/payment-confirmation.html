<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Confirmation</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fa;font-family:Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fa;padding:30px 0;">
    <tr>
        <td align="center">

            <table width="650" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:12px;overflow:hidden;">

                <tr>
                    <td align="center"
                        style="background:#2563eb;color:white;padding:25px;font-size:28px;font-weight:bold;">
                        E-Commerce Store
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding:40px 30px;">
                        <div style="font-size:60px;">✅</div>

                        <h2 style="margin-top:10px;color:#111827;">
                            Payment Successful
                        </h2>

                        <p style="color:#6b7280;font-size:16px;">
                            Hello
                            <strong th:text="${customerName}"></strong>,
                        </p>

                        <p style="color:#6b7280;font-size:16px;">
                            Your payment has been processed successfully.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:0 40px 30px 40px;">

                        <table width="100%"
                               style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;">
                            <tr>
                                <td style="padding:15px;">
                                    <strong>Order Reference</strong>
                                </td>
                                <td align="right"
                                    style="padding:15px;"
                                    th:text="${orderReference}">
                                </td>
                            </tr>

                            <tr>
                                <td style="padding:15px;">
                                    <strong>Amount Paid</strong>
                                </td>
                                <td align="right"
                                    style="padding:15px;font-size:20px;color:#16a34a;font-weight:bold;">
                                    $<span th:text="${amount}"></span>
                                </td>
                            </tr>
                        </table>

                    </td>
                </tr>

                <tr>
                    <td align="center"
                        style="padding:20px;color:#9ca3af;font-size:13px;">
                        Thank you for choosing us ❤️
                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>

</body>
</html>
